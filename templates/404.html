<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Page title displayed on browser tab -->
  <title>404 - Page Not Found</title>

  <!-- Template-specific external stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='error.css') }}">

  <!-- Google Anton font pre-connects and stylesheet import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Main container for HTTP 404 error view -->
  <main class="container">
    
    <!-- Primary error heading -->
    <h1>404 - Page Not Found</h1>
    
    <!-- Explanatory message for end user -->
    <p>Oops! The page or menu item you are looking for doesn't exist.</p>
    
    <!-- Navigation action button routing back to homepage catalog -->
    <a href="{{ url_for('home') }}" class="home-btn">Back to Home</a>

  </main>

</body>
</html>
