<!--404 error render template-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Error</title>
  <!--stylesheets and font-->

  <!--the css page for this render template-->
  <link rel="stylesheet" href="{{ url_for('static', filename='error.css') }}">

  <!--font connections-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  
<body>
  <main class="container">
    <!--informs user of error-->
    <h1>404 - Page Not Found</h1>
    <p>Oops! The page or menu item you are looking for doesn't exist.</p>
    <!--link routed to home-->
    <a href="{{ url_for('home') }}" class="home-btn">Back to Home</a>
  </main>
</body>
</html>
