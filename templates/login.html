<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canteen Login</title>
  
  <!-- Global and template-specific stylesheets -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

  <!-- Centered authentication wrapper container -->
  <main class="login-wrapper">
    <div class="login-card">
      <h1>Login</h1>
      
      <!-- Authentication form submitting POST request to login route handler -->
      <form action="{{ url_for('user_login') }}" method="POST">
        
        <!-- Student ID / Username input field -->
        <div class="input">
          <label for="username">Student ID</label>
          <input type="text" id="username" name="username" placeholder="E.g. 21345" autocomplete="username" required>
        </div>

        <!-- Password input field -->
        <div class="input">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
        </div>

        <!-- Display flash notifications for authentication errors -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flashes">
              {% for message in messages %}
                <p>{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <!-- Form submission trigger -->
        <button type="submit" class="login-btn">Login</button>

        <!-- Navigation redirect for unregistered accounts -->
        <p class="signup-instead">
          Don't have an account?
          <a href="{{ url_for('signup') }}">Sign up</a>
        </p>

      </form>
    </div>
  </main>

</body>
</html>
