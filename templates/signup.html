<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  
  <!-- Global and template-specific stylesheets -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='signup.css') }}">
</head>
<body>

  <!-- Main registration page container -->
  <main class="signup-wrapper">
    <div class="signup-card">
      <h1>Create an Account</h1>

      <!-- Registration form submitting POST request to signup route handler -->
      <form action="{{ url_for('signup') }}" method="POST">
        
        <!-- Student ID / User identifier input field -->
        <div class="input">
          <label for="ID">Student ID</label>
          <input type="text" id="ID" name="ID" placeholder="E.g. 21345" autocomplete="off" required>
        </div>

        <!-- User first name input field -->
        <div class="input">
          <label for="first_name">First Name</label>
          <input type="text" id="first_name" name="first_name" placeholder="First name" autocomplete="given-name" required>
        </div>

        <!-- User last name input field -->
        <div class="input">
          <label for="last_name">Last Name</label>
          <input type="text" id="last_name" name="last_name" placeholder="Last name" autocomplete="family-name" required>
        </div>

        <!-- New password creation field -->
        <div class="input">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Password" autocomplete="new-password" required>
        </div>

        <!-- Password verification input field -->
        <div class="input">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" autocomplete="new-password" required>
        </div>

        <!-- Flash error and validation message container -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flashes">
              {% for message in messages %}
                <p>{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <!-- Account submission action trigger -->
        <button type="submit" class="signup-button">Sign Up</button>

      </form>

      <!-- Navigation link for existing account holders -->
      <p class="login-instead">
        Already have an account?
        <a href="{{ url_for('user_login') }}">Log in</a>
      </p>
    </div>
  </main>

</body>
</html>
