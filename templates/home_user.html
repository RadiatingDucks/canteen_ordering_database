<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="container top-bar-content">
                <div class="top-left"><a href="{{ url_for('home') }}">CANTEEN</a></div>
                <div class="search-container">
                    <input type="text" placeholder="Search here...">
                    <span class="material-symbols-outlined">search</span>
                </div>
                <div class="top-right"><a href="/login">Log in</a></div>
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="container nav-content">
                <div class="nav-links">
                    <a href="#">Main</a>
                    <a href="#">Snacks</a>
                    <a href="#">Drinks</a>
                    <a href="#">Others</a>
                </div>
                <div class="cart"><a href="{{ url_for('trolley') }}">🛒 $0.00</a></div>
            </div>
        </nav>
    </header>

    <main class="container">
        <a class="filter" href="#">Filter by:</a>
        <h1>Menu</h1>

        <div class="menu-grid">
            {% for item in menu_items %}
            <a href="{{ url_for('item', item_ID=item.item_ID) }}">
                <div class="product-box">
                    <h3>{{ item.item_name }}</h3>
                    <img src="{{ url_for('static', filename = 'images/' + item.item_photo) }}" alt="{{ item.item_name }}">
                    <p class="category">{{ item.item_type }}</p>

                    <div class="price_row">
                        <span class="price">${{ "%.2f" |format(item.price) }}</span>
                        {% if item.is_available %}
                            <button class="add-btn">Add</button>
                        {% else %}
                            <span class="out-of-stock">Out of Stock</span>
                        {% endif %}
                    </div>
                </div>
            </a>
            {% endfor %}
        </div>
    </main>

</body>
</html>
